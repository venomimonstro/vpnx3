services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vpnx3
      POSTGRES_USER: vpnx3
      POSTGRES_PASSWORD: vpnx3_dev_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpnx3 -d vpnx3"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - vpnx3_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile.controlplane
    entrypoint: ["/migrate"]
    environment:
      VPNX3_DATABASE_URL: postgres://vpnx3:vpnx3_dev_only@postgres:5432/vpnx3?sslmode=disable
      VPNX3_MIGRATIONS_DIR: /migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  controlplane:
    build:
      context: .
      dockerfile: deploy/Dockerfile.controlplane
    environment:
      VPNX3_ENV: development
      VPNX3_HTTP_ADDR: :8080
      VPNX3_DATABASE_URL: postgres://vpnx3:vpnx3_dev_only@postgres:5432/vpnx3?sslmode=disable
      VPNX3_LOG_LEVEL: debug
      VPNX3_ADMIN_SESSION_TTL: 12h
      VPNX3_BOOTSTRAP_OWNER_EMAIL: ${VPNX3_BOOTSTRAP_OWNER_EMAIL}
      VPNX3_BOOTSTRAP_OWNER_PASSWORD: ${VPNX3_BOOTSTRAP_OWNER_PASSWORD}
      VPNX3_CONFIG_SIGNING_KEY: ${VPNX3_CONFIG_SIGNING_KEY}
      VPNX3_ACCESS_SIGNING_KEY: ${VPNX3_ACCESS_SIGNING_KEY}
      VPNX3_RELEASE_SIGNING_KEY: ${VPNX3_RELEASE_SIGNING_KEY:-}
      VPNX3_ACCESS_LEASE_TTL: 6h
      VPNX3_TRIAL_DAYS: 7
      VPNX3_ARTIFACT_DIR: /var/lib/vpnx3/artifacts
      VPNX3_ARTIFACT_MAX_MB: 300
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - vpnx3_artifacts:/var/lib/vpnx3/artifacts

volumes:
  vpnx3_pgdata:
  vpnx3_artifacts:
